<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Name - Full Stack Developer</title>
    <script>
      // Prevent flash of wrong theme
      const theme = localStorage.getItem('theme');
      if (theme) document.documentElement.setAttribute('data-theme', theme);
    </script>
    <link rel="stylesheet" href="./styles/theme.css">
    <link rel="stylesheet" href="./styles/main.css">
  </head>

        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>

      <!-- Hero Section (Figma style) -->

          <a href="./pages/blog.html" class="nav-link">blog →</a>
        </nav>
      </section>

      <!-- Terminal Section -->
      <section>
        <div class="terminal" tabindex="0" role="region" aria-label="Terminal demonstration">
          <div><span class="prompt">$</span> <span class="command">whoami</span></div>
          <div class="output">your-name</div>
          <div>&nbsp;</div>
          <div><span class="prompt">$</span> <span class="command">cat location.txt</span></div>
          <div class="output">San Francisco, CA</div>
          <div>&nbsp;</div>
          <div><span class="prompt">$</span> <span class="command">cat role.txt</span></div>
          <div class="output">Full Stack Developer</div>
          <div>&nbsp;</div>
          <div><span class="prompt">$</span> <span class="command">ls skills/</span></div>
          <div class="output">javascript/  typescript/  react/  node.js/  python/</div>
          <div class="output">postgresql/  docker/  aws/  kubernetes/</div>
