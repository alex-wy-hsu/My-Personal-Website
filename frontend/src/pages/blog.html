<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog - Your Name</title>
    <script>
      // Prevent flash of wrong theme
      const theme = localStorage.getItem('theme');
      if (theme) document.documentElement.setAttribute('data-theme', theme);
    </script>
    <link rel="stylesheet" href="../styles/theme.css">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/blog.css">
  </head>
  <body>
    <!-- Theme toggle button (top right) -->
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">
      <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <main class="container">
      <!-- Back link -->
      <a href="../index.html" class="back-link">← Back</a>
      
      <!-- Page title -->
      <h1 class="page-title">Blog</h1>
      
      <!-- Blog posts grid -->
      <div class="blog-grid" id="blog-posts">
        <!-- Posts loaded dynamically -->
      </div>
    </main>

    <script type="module">
      import { createBlogCard } from '../components/BlogCard.js';
      import { initThemeToggle } from '../components/ThemeToggle.js';
      
      // Initialize theme toggle
      initThemeToggle();
      
      async function loadBlogPosts() {
        try {
          const res = await fetch('../data/posts.json');
          const posts = await res.json();
          const grid = document.getElementById('blog-posts');
          
          posts.forEach(post => {
            const card = createBlogCard(post);
            grid.appendChild(card);
          });
        } catch (e) {
          console.error('Failed to load blog posts:', e);
        }
      }
      
      document.addEventListener('DOMContentLoaded', loadBlogPosts);
    </script>
  </body>
</html>
